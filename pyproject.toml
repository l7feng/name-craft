[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namecraft"
version = "0.3.0"
description = "Rule-chain based bulk file renaming tool (clean-room rewrite inspired by ReNamer behavior)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "32112" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gui = ["pywebview>=5"]

[project.scripts]
namecraft = "namecraft.cli:main"
namecraft-gui = "namecraft.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"